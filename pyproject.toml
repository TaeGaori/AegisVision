[project]
name = "roboflow-universe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TaeGaori", email = "xoengur@naver.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "xgboost>=3.2.0",
    "ultralytics>=8.4.153",
]

[project.scripts]
roboflow-universe = "roboflow_universe:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
