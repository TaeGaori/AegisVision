[project]
name = "AegisVision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TaeGaori", email = "xoengur@naver.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "xgboost>=3.2.0",
    "ultralytics>=8.4.153",
    "mlflow>=3.16.0",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.0.54",
    "pipreqs>=0.5.0",
    "streamlit>=1.63.0",
    "requests>=2.34.2",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "slowapi>=0.1.10",
    "bcrypt<4.1",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
