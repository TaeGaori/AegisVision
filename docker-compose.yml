services:
  api:
    build: .
    container_name: AegisVision

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    env_file:
      - .env

    volumes:
      - ./runs:/app/runs           # YOLO 모델 가중치
      - ./mlflow.db:/app/mlflow.db # MLflow 학습 기록

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17

    ports:
      - "5432:5432"
    container_name: AegisVision_db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: AegisVision-streamlit

    ports:
      - "8501:8501"

    environment:
      API_BASE_URL: http://api:8000
    
    depends_on:
      - api

    command: >
      streamlit run streamlit_app.py
      --server.address=0.0.0.0
      --server.port=8501


volumes:
  pgdata: