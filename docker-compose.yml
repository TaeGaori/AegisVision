services:
  api:
    build: .
    container_name: AegisVision

    # HTTPS는 아래 caddy가 담당하므로, 운영 환경에서는 8000을 호스트에 직접 노출하지 않는다.
    # (직접 노출하면 누구나 http://서버IP:8000 으로 인증서 없이 접근 가능해져 HTTPS를 우회하게 됨)
    # 개발 중 브라우저에서 바로 확인하고 싶을 때만 아래 주석을 풀어서 사용
    # ports:
    #   - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    env_file:
      - .env

    volumes:
      - ./runs:/app/runs
      - ./mlflow.db:/app/mlflow.db
      - ./defense_metrics.json:/app/defense_metrics.json

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5


  db:
    image: postgres:17
    container_name: AegisVision_db

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_API_KEY: ${REACT_API_KEY}

    container_name: AegisVision-web

    ports:
      - "8080:80"

    depends_on:
      api:
        condition: service_healthy


