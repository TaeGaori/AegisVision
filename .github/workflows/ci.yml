name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: AegisVision
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run pytest
        run: uv run pytest -v

      - name: Build Docker image
        run: docker build -t aegisvision-api .

      - name: Run container
        run: |
          docker run -d -p 8000:8000 --name test-api \
            --network="host" \
            -e DATABASE_URL="postgresql+psycopg2://postgres:testpassword@localhost:5432/AegisVision" \
            -e API_KEYS="test-key=ci" \
            -e JWT_SECRET_KEY="test-secret-for-ci-only" \
            -e DEFAULT_ADMIN_USERNAME="admin" \
            -e DEFAULT_ADMIN_PASSWORD="testpassword-ci" \
            aegisvision-api

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done
          echo "API did not become healthy in time"
          docker logs test-api
          exit 1

      - name: Check /health is public
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          if [ "$status" != "200" ]; then
            echo "Expected 200 from /health, got $status"
            exit 1
          fi

      - name: Check /metrics requires API key
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/metrics)
          if [ "$status" != "401" ]; then
            echo "Expected 401 from /metrics without key, got $status"
            exit 1
          fi

      - name: Check /metrics works with API key
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "X-API-Key: test-key" http://localhost:8000/metrics)
          if [ "$status" != "200" ]; then
            echo "Expected 200 from /metrics with key, got $status"
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker logs test-api

      - name: Stop container
        if: always()
        run: docker stop test-api || true